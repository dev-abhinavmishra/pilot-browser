<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:* ws://localhost:*; script-src 'self'">
    <title>Pilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app" class="theme-dark">
    <!-- ======================= SIDEBAR ======================= -->
    <aside id="sidebar">
        <div class="sidebar-drag"></div>

        <div class="sidebar-head">
            <div class="window-controls">
                <button class="wc wc-close" id="wc-close" title="Close" aria-label="Close"></button>
                <button class="wc wc-min" id="wc-min" title="Minimize" aria-label="Minimize"></button>
                <button class="wc wc-max" id="wc-max" title="Maximize" aria-label="Maximize"></button>
            </div>
            <div class="brand">
                <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 2.5 21 7.5v9L12 21.5 3 16.5v-9L12 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M12 8.2 16.6 10.6v4.8L12 17.8l-4.6-2.4v-4.8L12 8.2Z" fill="currentColor" opacity=".85"/>
                </svg>
                <span>Pilot</span>
            </div>
            <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar (Ctrl+Shift+B)" aria-label="Toggle sidebar (Ctrl+Shift+B)">
                <i class="fa-solid fa-sidebar fa-flip-horizontal"></i>
            </button>
        </div>

        <div class="space-switcher" id="space-switcher" title="Switch space"></div>

        <div class="sidebar-scroll">
            <div class="pinned-label" id="pinned-label"><span>Pinned</span></div>
            <div class="pinned-grid" id="pinned-grid"></div>
            <div class="tab-list" id="tab-list"></div>
        </div>

        <div class="sidebar-foot">
            <button class="foot-btn" id="new-tab-btn" title="New tab (Ctrl+T)" aria-label="New tab (Ctrl+T)"><i class="fa-solid fa-plus"></i><span>NEW</span></button>
            <button class="foot-btn" id="palette-btn" title="Command deck (Ctrl+K)" aria-label="Command deck (Ctrl+K)"><i class="fa-solid fa-terminal"></i><span>DECK</span></button>
            <button class="foot-btn" id="library-btn" title="Library: history, bookmarks, downloads" aria-label="Library: history, bookmarks, downloads"><i class="fa-solid fa-layer-group"></i><span>LOG</span></button>
            <button class="foot-btn" id="assistant-toggle" title="Pilot AI assistant" aria-label="Pilot AI assistant"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI</span></button>
            <button class="foot-btn" id="settings-btn" title="Settings" aria-label="Settings"><i class="fa-solid fa-gear"></i><span>SET</span></button>
        </div>
    </aside>

    <!-- ======================= MAIN ======================= -->
    <section id="main">
        <div id="toolbar" class="drag">
            <div class="nav-cluster nodrag">
                <button class="icon-btn" id="nav-back" title="Back (Alt+←)" aria-label="Back (Alt+←)"><i class="fa-solid fa-arrow-left"></i></button>
                <button class="icon-btn" id="nav-forward" title="Forward (Alt+→)" aria-label="Forward (Alt+→)"><i class="fa-solid fa-arrow-right"></i></button>
                <button class="icon-btn" id="nav-reload" title="Reload (Ctrl+R)" aria-label="Reload (Ctrl+R)"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="omnibox nodrag" id="omnibox">
                <i class="fa-solid fa-lock omni-icon" id="omni-lock"></i>
                <input id="omni-input" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter address">
                <div class="omni-suggest" id="omni-suggest"></div>
            </div>
            <div class="tool-cluster nodrag">
                <button class="icon-btn" id="btn-bookmark" title="Bookmark (Ctrl+D)" aria-label="Bookmark (Ctrl+D)"><i class="fa-regular fa-star"></i></button>
                <button class="icon-btn" id="btn-find" title="Find in page (Ctrl+F)" aria-label="Find in page (Ctrl+F)"><i class="fa-solid fa-magnifying-glass"></i></button>
                <button class="icon-btn" id="btn-split" title="Split view" aria-label="Split view"><i class="fa-solid fa-table-columns"></i></button>
                <button class="icon-btn" id="btn-menu" title="Menu" aria-label="Menu"><i class="fa-solid fa-ellipsis"></i></button>
            </div>
        </div>
        <div id="progress"><div id="progress-fill"></div></div>

        <div id="stage">
            <div id="webviews"></div>
            <div id="split-divider"></div>

            <!-- Start page overlay — the console -->
            <div id="start-overlay" class="hidden">
                <div class="start-inner">
                    <div class="start-head">
                        <div class="start-wordmark">PILOT</div>
                        <div class="start-clock" id="start-clock">9:41</div>
                        <div class="start-date" id="start-date"></div>
                    </div>

                    <div class="console">
                        <div class="console-toprow">
                            <div class="con-modes" id="con-modes">
                                <button class="con-mode active" data-mode="search">SEARCH</button>
                                <button class="con-mode" data-mode="ask">ASK&nbsp;AI</button>
                                <button class="con-mode" data-mode="cmd">DECK</button>
                            </div>
                            <div class="con-led" id="con-led"></div>
                            <div class="con-engines" id="con-engines"></div>
                        </div>

                        <div class="con-input-row">
                            <i class="fa-solid fa-bolt con-bolt"></i>
                            <input id="start-input" type="text" spellcheck="false" autocomplete="off" placeholder="Where to, captain?">
                            <kbd class="con-enter">⏎</kbd>
                        </div>

                        <div class="console-botrow">
                            <div class="con-group">
                                <span class="con-label">OPEN&nbsp;IN</span>
                                <div class="con-openin" id="con-openin">
                                    <button class="con-sw active" data-openin="tab">THIS&nbsp;TAB</button>
                                    <button class="con-sw" data-openin="new">NEW</button>
                                    <button class="con-sw" data-openin="split">SPLIT</button>
                                </div>
                            </div>
                            <div class="con-chips">
                                <button data-lib="history"><i class="fa-solid fa-clock-rotate-left"></i>LOG</button>
                                <button data-lib="bookmarks"><i class="fa-solid fa-star"></i>SAVED</button>
                                <button data-lib="downloads"><i class="fa-solid fa-download"></i>FILES</button>
                                <button data-lib="settings"><i class="fa-solid fa-gear"></i>SETUP</button>
                            </div>
                        </div>

                        <div class="con-readout" id="con-readout"></div>
                    </div>

                    <div class="start-tiles" id="start-tiles"></div>
                    <div class="start-hints">
                        <span><kbd>Ctrl+K</kbd> command deck</span>
                        <span><kbd>Ctrl+L</kbd> flight strip</span>
                        <span><kbd>Ctrl+T</kbd> new tab</span>
                    </div>
                </div>
            </div>

            <!-- Find bar -->
            <div id="find-bar" class="hidden">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="find-input" type="text" placeholder="Find in page" spellcheck="false">
                <span id="find-count"></span>
                <button class="icon-btn" id="find-prev"><i class="fa-solid fa-chevron-up"></i></button>
                <button class="icon-btn" id="find-next"><i class="fa-solid fa-chevron-down"></i></button>
                <button class="icon-btn" id="find-close"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="status-bubble" class="hidden"></div>
        </div>
    </section>

    <!-- ======================= ASSISTANT ======================= -->
    <aside id="assistant-panel" class="hidden">
        <div class="assistant-head">
            <div class="assistant-title"><i class="fa-solid fa-wand-magic-sparkles"></i> Pilot AI</div>
            <div class="assistant-head-right">
                <span class="ai-status" id="assistant-status" title="Which AI is answering: the configured LLM or built-in rules"></span>
                <button class="icon-btn" id="assistant-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="assistant-body" id="assistant-body"></div>
        <div class="assistant-foot">
            <button class="chip" id="assistant-summarize" title="Summarize current page" aria-label="Summarize current page"><i class="fa-solid fa-align-left"></i> Summarize page</button>
            <button class="chip" id="assistant-task" title="Task mode — Pilot drives this tab" aria-label="Task mode — Pilot drives this tab"><i class="fa-solid fa-rocket"></i> Task</button>
            <div class="assistant-input-row">
                <input id="assistant-input" type="text" placeholder="Ask anything…" autocomplete="off">
                <button class="icon-btn send" id="assistant-send"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </aside>

    <!-- ======================= OVERLAYS ======================= -->
    <div id="palette" class="overlay hidden">
        <div class="palette-box">
            <div class="palette-input-row">
                <i class="fa-solid fa-terminal"></i>
                <input id="palette-input" type="text" spellcheck="false" placeholder="Type a command or search…">
                <kbd>esc</kbd>
            </div>
            <div class="palette-results" id="palette-results"></div>
        </div>
    </div>

    <div id="library" class="overlay hidden">
        <div class="library-box">
            <div class="library-tabs">
                <button class="lib-tab active" data-lib="history"><i class="fa-solid fa-clock-rotate-left"></i> History</button>
                <button class="lib-tab" data-lib="bookmarks"><i class="fa-solid fa-star"></i> Bookmarks</button>
                <button class="lib-tab" data-lib="downloads"><i class="fa-solid fa-download"></i> Downloads</button>
                <button class="lib-tab" data-lib="settings"><i class="fa-solid fa-gear"></i> Settings</button>
                <span class="flex"></span>
                <button class="icon-btn" id="library-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="library-content" id="library-content"></div>
        </div>
    </div>

    <div id="ctx-menu" class="hidden"></div>
    <div id="toasts"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
