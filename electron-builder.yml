appId: com.pilot.browser
productName: Pilot Browser
copyright: Copyright © 2026 Pilot Browser

directories:
  output: release/${version}
  buildResources: assets

files:
  - dist/renderer/**/*
  - electron/**/*
  - package.json
  - "!src/**"
  - "!backend/**"
  - "!scripts/**"

extraResources:
  - from: backend
    to: app/backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!pilot_browser.db"
      - "!pilot_backend.log"

asar: true

win:
  target: ["nsis", "zip"]
  icon: assets/icon.png
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  publisherName: "Pilot Browser Team"
  fileAssociations:
    - ext: html
      name: HTML File
      role: Viewer
    - ext: htm
      name: HTML File
      role: Viewer

mac:
  target: ["dmg", "zip"]
  icon: assets/icon.png
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

linux:
  target: ["AppImage", "deb"]
  icon: assets/icon.png
  category: Network
  maintainer: "Pilot Browser Team"
  vendor: "Pilot Browser"
  synopsis: "AI-powered minimalist browser"
  description: |
    Pilot Browser is an Arc-inspired desktop browser: vertical tabs, spaces,
    command palette, split view, and a local AI assistant.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Pilot Browser"
  uninstallDisplayName: "Pilot Browser"

publish:
  provider: github
  releaseType: release
  publishAutoUpdate: false

generateUpdatesFilesForAllChannels: false
